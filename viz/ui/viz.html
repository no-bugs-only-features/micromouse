<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Micromouse Visualizer</title>
<style>
  :root{
    --bg:#0d131a;
    --panel:#121a23;
    --grid:#1f2b38;
    --wall:#8fc7e0;
    --wall-dim:#2c3d4c;
    --ink:#cdd8e0;
    --ink-dim:#6f818f;
    --amber:#e8a33d;
    --amber-dim:#5a4526;
    --near:#274a63;
    --far:#e8a33d;
    --mono: 'IBM Plex Mono', 'SF Mono', Menlo, Consolas, monospace;
    --sans: 'Inter', -apple-system, sans-serif;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--ink);
    font-family:var(--sans);
    display:flex;
    height:100vh;
    overflow:hidden;
  }
  #sidebar{
    width:280px;
    background:var(--panel);
    border-right:1px solid var(--grid);
    padding:20px;
    display:flex;
    flex-direction:column;
    gap:18px;
    overflow-y:auto;
  }
  h1{
    font-size:15px;
    font-weight:600;
    letter-spacing:0.02em;
    margin:0;
    color:var(--ink);
  }
  h1 span{color:var(--amber);}
  .sub{
    font-family:var(--mono);
    font-size:11px;
    color:var(--ink-dim);
    margin-top:2px;
  }
  .block{
    border-top:1px solid var(--grid);
    padding-top:14px;
  }
  .block-label{
    font-size:11px;
    color:var(--ink-dim);
    margin-bottom:10px;
    font-family:var(--mono);
  }
  .row{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:8px;
    margin-bottom:8px;
    font-size:13px;
  }
  .toggle{
    display:flex;
    align-items:center;
    gap:8px;
    cursor:pointer;
    user-select:none;
  }
  .toggle input{accent-color:var(--amber);}
  button{
    background:var(--grid);
    color:var(--ink);
    border:1px solid var(--wall-dim);
    border-radius:3px;
    padding:7px 10px;
    font-size:12px;
    font-family:var(--sans);
    cursor:pointer;
  }
  button:hover{border-color:var(--amber);}
  button.primary{
    background:var(--amber);
    color:#1a1206;
    border:none;
    font-weight:600;
  }
  .btn-row{display:flex;gap:6px;}
  .btn-row button{flex:1;}
  input[type=range]{
    width:100%;
    accent-color:var(--amber);
  }
  input[type=file]{display:none;}
  .filebtn{
    display:block;
    text-align:center;
  }
  #stats{
    font-family:var(--mono);
    font-size:11.5px;
    color:var(--ink-dim);
    line-height:1.9;
  }
  #stats b{color:var(--ink);font-weight:600;}
  #main{
    flex:1;
    display:flex;
    flex-direction:column;
    min-width:0;
  }
  #scrub{
    flex:0 0 auto;
    display:flex;
    align-items:center;
    gap:10px;
    padding:14px 24px;
    border-bottom:1px solid var(--grid);
    background:var(--panel);
  }
  #scrub span{
    font-family:var(--mono);
    font-size:11px;
    color:var(--ink-dim);
    width:48px;
    flex:0 0 auto;
  }
  #scrubBar{
    flex:1;
  }
  #canvasWrap{
    flex:1;
    display:flex;
    align-items:center;
    justify-content:center;
    min-height:0;
  }
  canvas{
    background:var(--bg);
  }
  button:disabled,input:disabled{opacity:.4;cursor:default;}
</style>
</head>
<body>

<div id="sidebar">
  <div>
    <h1>maze<span>viz</span></h1>
    <div class="sub">micromouse replay tool</div>
  </div>

  <div class="block">
    <div class="block-label">SOURCE</div>
    <div class="btn-row">
      <button class="primary" id="loadBtn">Open maze JSON</button>
    </div>
    <div class="sub" style="margin-top:8px;">or drop a .json file anywhere</div>
    <div id="msg" role="alert" style="color:#e06b5a;font-size:12px;margin-top:8px;"></div>
    <div class="btn-row" style="margin-top:10px;">
      <button id="genBtn">Sample maze</button>
    </div>
    <input type="file" id="fileInput" accept=".json,application/json">
  </div>

  <div class="block">
    <div class="block-label">LAYERS</div>
    <div class="row"><label class="toggle"><input type="checkbox" id="lyWalls" checked>Walls</label></div>
    <div class="row"><label class="toggle"><input type="checkbox" id="lyHeat" checked>Flood-fill heatmap</label></div>
    <div class="row"><label class="toggle"><input type="checkbox" id="lyPath" checked>Path overlay</label></div>
    <div class="row"><label class="toggle"><input type="checkbox" id="lyMouse" checked>Mouse marker</label></div>
  </div>

  <div class="block">
    <div class="block-label">PLAYBACK</div>
    <div class="btn-row">
      <button id="playBtn" class="primary">Play</button>
      <button id="stepBtn">Step</button>
      <button id="resetBtn">Reset</button>
    </div>
    <div class="row" style="margin-top:12px;">
      <span style="font-size:11px;color:var(--ink-dim);">Speed</span>
    </div>
    <input type="range" id="speed" min="0.25" max="8" step="0.25" value="2">
  </div>

  <div class="block">
    <div class="block-label">TELEMETRY</div>
    <div id="stats"></div>
  </div>
</div>

<div id="main">
  <div id="scrub">
    <span id="scrubT">0.00s</span>
    <input type="range" id="scrubBar" min="0" max="100" value="0">
  </div>
  <div id="canvasWrap">
    <canvas id="cv"></canvas>
  </div>
</div>

<script>
// ---------- data model ----------
// walls bitmask per cell: bit3=N(8) bit2=E(4) bit1=S(2) bit0=W(1)  (matches C engine convention)
const N=8,E=4,S=2,W=1;
const OPP={ [N]:S, [S]:N, [E]:W, [W]:E };

let maze = null; // {size, walls, start, goal, distances, path, run_log}
let playing = false;
let simTime = 0;
let lastFrame = null;

const canvas = document.getElementById('cv');
const ctx = canvas.getContext('2d');

function fitCanvas(){
  const wrap = document.getElementById('canvasWrap');
  const pad = 40;
  const avail = Math.min(wrap.clientWidth, wrap.clientHeight) - pad;
  canvas.width = avail; canvas.height = avail;
}
window.addEventListener('resize', ()=>{ fitCanvas(); render(); });

// ---------- maze generation (randomized DFS, for demo/testing) ----------
function generateMaze(size){
  const walls = Array.from({length:size}, ()=>Array(size).fill(N|E|S|W));
  const visited = Array.from({length:size}, ()=>Array(size).fill(false));
  const dirs = [[0,-1,N],[0,1,S],[1,0,E],[-1,0,W]];

  function shuffle(a){ for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }

  const stack = [[0,0]];
  visited[0][0]=true;
  while(stack.length){
    const [x,y] = stack[stack.length-1];
    const options = shuffle(dirs.slice()).filter(([dx,dy])=>{
      const nx=x+dx, ny=y+dy;
      return nx>=0 && ny>=0 && nx<size && ny<size && !visited[ny][nx];
    });
    if(options.length===0){ stack.pop(); continue; }
    const [dx,dy,dir] = options[0];
    const nx=x+dx, ny=y+dy;
    walls[y][x] &= ~dir;
    walls[ny][nx] &= ~OPP[dir];
    visited[ny][nx]=true;
    stack.push([nx,ny]);
  }
  // braid: knock a few extra walls down so it isn't a perfect single-path maze
  for(let i=0;i<size*2;i++){
    const x=Math.floor(Math.random()*size), y=Math.floor(Math.random()*size);
    const opts = shuffle(dirs.slice());
    for(const [dx,dy,dir] of opts){
      const nx=x+dx, ny=y+dy;
      if(nx<0||ny<0||nx>=size||ny>=size) continue;
      if(walls[y][x] & dir){
        walls[y][x] &= ~dir;
        walls[ny][nx] &= ~OPP[dir];
        break;
      }
    }
  }
  return walls;
}

function bfsDistances(walls, size, goal){
  const dist = Array.from({length:size}, ()=>Array(size).fill(-1));
  dist[goal.y][goal.x]=0;
  const q=[[goal.x,goal.y]];
  const dirs=[[0,-1,N,S],[0,1,S,N],[1,0,E,W],[-1,0,W,E]];
  let head=0;
  while(head<q.length){
    const [x,y]=q[head++];
    for(const [dx,dy,dir,rev] of dirs){
      const nx=x+dx, ny=y+dy;
      if(nx<0||ny<0||nx>=size||ny>=size) continue;
      if(walls[y][x] & dir) continue; // wall blocks this direction from (x,y)
      if(dist[ny][nx]!==-1) continue;
      dist[ny][nx]=dist[y][x]+1;
      q.push([nx,ny]);
    }
  }
  return dist;
}

function reconstructPath(walls, size, start, goal, dist){
  const path=[{x:start.x,y:start.y}];
  let cx=start.x, cy=start.y;
  const dirs=[[0,-1,N],[0,1,S],[1,0,E],[-1,0,W]];
  let guard=0;
  while((cx!==goal.x||cy!==goal.y) && guard++<size*size*2){
    let best=null, bestD=Infinity;
    for(const [dx,dy,dir] of dirs){
      if(walls[cy][cx] & dir) continue;
      const nx=cx+dx, ny=cy+dy;
      if(nx<0||ny<0||nx>=size||ny>=size) continue;
      if(dist[ny][nx]>=0 && dist[ny][nx]<bestD){ bestD=dist[ny][nx]; best=[nx,ny]; }
    }
    if(!best) break;
    cx=best[0]; cy=best[1];
    path.push({x:cx,y:cy});
  }
  return path;
}

function cornerOpen(walls, size, x, y, dx, dy){
  // diagonal cut from (x,y) to (x+dx,y+dy) is only legal if both orthogonal
  // walls forming the corner are open (matches maze_json_format.md's rule)
  const nx=x+dx, ny=y+dy;
  if(nx<0||ny<0||nx>=size||ny>=size) return false;
  const horiz = dx>0 ? E : W;      // wall from (x,y) toward (x+dx,y)
  const vert  = dy>0 ? S : N;      // wall from (x,y) toward (x,y+dy)
  const horizOpen = !(walls[y][x] & horiz);
  const vertOpen  = !(walls[y][x] & vert);
  return horizOpen && vertOpen;
}

const esc = t => String(t).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

function decodeText(buf){
  // files written by PowerShell redirection are UTF-16 with a BOM; handle that and plain UTF-8
  const b = new Uint8Array(buf);
  if(b[0]===0xFF && b[1]===0xFE) return new TextDecoder('utf-16le').decode(b.subarray(2));
  if(b[0]===0xFE && b[1]===0xFF) return new TextDecoder('utf-16be').decode(b.subarray(2));
  return new TextDecoder('utf-8').decode(b);
}

function structureError(d){
  if(!d || typeof d!=='object' || Array.isArray(d)) return 'top level must be a JSON object';
  for(const k of ['size','walls','start','goal']) if(!(k in d)) return `missing required key "${k}"`;
  const n = d.size;
  if(!Number.isInteger(n) || n<1) return '"size" must be a positive integer';
  const grid = (g, ok) => Array.isArray(g) && g.length===n && g.every(r => Array.isArray(r) && r.length===n && r.every(ok));
  if(!grid(d.walls, v => Number.isInteger(v) && v>=0 && v<=15)) return `"walls" must be a ${n}×${n} grid of integers 0–15`;
  for(const k of ['start','goal']){
    const p = d[k];
    if(!p || !Number.isInteger(p.x) || !Number.isInteger(p.y) || p.x<0 || p.y<0 || p.x>=n || p.y>=n) return `"${k}" must be {"x","y"} inside the maze`;
  }
  if('distances' in d && !grid(d.distances, v => Number.isInteger(v))) return `"distances" must be a ${n}×${n} grid of integers`;
  if('path' in d && !(Array.isArray(d.path) && d.path.every(p => p && typeof p.x==='number' && typeof p.y==='number'))) return '"path" must be a list of {"x","y"}';
  if('run_log' in d && !(Array.isArray(d.run_log) && d.run_log.every(r => r && ['t','x','y'].every(k => typeof r[k]==='number')))) return '"run_log" must be a list of {"t","x","y"}';
  return null;
}

function wallIssues(walls, size){
  const out = [];
  for(let y=0;y<size;y++) for(let x=0;x<size;x++){
    const w = walls[y][x];
    if(x+1<size && !!(w&E) !== !!(walls[y][x+1]&W)) out.push(`one-sided wall between (${x},${y}) and (${x+1},${y})`);
    if(y+1<size && !!(w&S) !== !!(walls[y+1][x]&N)) out.push(`one-sided wall between (${x},${y}) and (${x},${y+1})`);
  }
  return out;
}

function validatePath(m){
  const {walls, size, path, start, goal} = m, issues = [], bad = new Set();
  if(!path.length) return {issues, bad};
  const out = path.findIndex(p => !(Number.isInteger(p.x) && Number.isInteger(p.y) && p.x>=0 && p.y>=0 && p.x<size && p.y<size));
  if(out>=0){ issues.push(`path step ${out} is outside the maze or off the cell grid`); bad.add(out); return {issues, bad}; }
  if(path[0].x!==start.x || path[0].y!==start.y) issues.push(`path starts at (${path[0].x},${path[0].y}), not the start cell`);
  const last = path[path.length-1];
  if(last.x!==goal.x || last.y!==goal.y) issues.push(`path ends at (${last.x},${last.y}), not the goal`);
  for(let i=1;i<path.length;i++){
    const a=path[i-1], b=path[i], dx=b.x-a.x, dy=b.y-a.y, ax=Math.abs(dx), ay=Math.abs(dy);
    if(ax+ay===0) continue;                                   // standing still is fine
    if(ax+ay===1){
      const dir = dx>0 ? E : dx<0 ? W : dy>0 ? S : N;
      if((walls[a.y][a.x] & dir) || (walls[b.y][b.x] & OPP[dir])){ issues.push(`step ${i}: (${a.x},${a.y}) to (${b.x},${b.y}) crosses a wall`); bad.add(i); }
    } else if(ax===1 && ay===1){
      if(b.move!=='diagonal'){ issues.push(`step ${i}: diagonal step is not marked "move":"diagonal"`); bad.add(i); }
      else if(!cornerOpen(walls,size,a.x,a.y,dx,dy)){ issues.push(`step ${i}: diagonal cut through a blocked corner`); bad.add(i); }
    } else { issues.push(`step ${i}: (${a.x},${a.y}) to (${b.x},${b.y}) is not adjacent`); bad.add(i); }
  }
  return {issues, bad};
}

function setMaze(m, source){
  const pv = validatePath(m);
  m.issues = pv.issues.concat(wallIssues(m.walls, m.size));
  if(m.distances[m.start.y][m.start.x] < 0) m.issues.unshift('goal is unreachable from the start cell');
  m.badSegs = pv.bad;
  m.source = source;
  maze = m; simTime = 0; playing = false;
  const has = m.run_log.length > 0;
  document.getElementById('playBtn').textContent = 'Play';
  ['playBtn','stepBtn','resetBtn','scrubBar'].forEach(id => document.getElementById(id).disabled = !has);
  const bar = document.getElementById('scrubBar');
  bar.max = has ? m.run_log[m.run_log.length-1].t*1000 : 0;
  bar.value = 0;
  document.getElementById('msg').textContent = '';
  render(); updateStats();
}

async function loadFile(f){
  try{
    const data = JSON.parse(decodeText(await f.arrayBuffer()));
    const err = structureError(data);
    if(err) throw new Error(err);
    const path = data.path || [];
    setMaze({
      size: data.size, walls: data.walls, start: data.start, goal: data.goal,
      distances: data.distances || bfsDistances(data.walls, data.size, data.goal),
      path,
      run_log: data.run_log || (path.length ? buildRunLog(path, 0.18) : [])   // path-only files replay at a constant 0.18 s per cell
    }, f.name);
  }catch(e){
    document.getElementById('msg').textContent = `Could not load ${f.name}: ${e.message}`;
  }
}

function buildRunLog(path, cellTime){
  // demo timing: constant time per cell — replace with real kinematics output when available
  return path.map((p,i)=>({t: +(i*cellTime).toFixed(3), x:p.x, y:p.y}));
}

function newRandomMaze(size=16){
  const walls = generateMaze(size);
  const start={x:0,y:0}, goal={x:Math.floor(size/2),y:Math.floor(size/2)};
  const distances = bfsDistances(walls, size, goal);
  const path = reconstructPath(walls, size, start, goal, distances);
  const run_log = buildRunLog(path, 0.18);
  setMaze({size, walls, start, goal, distances, path, run_log}, 'sample maze');
}

// ---------- rendering ----------
function render(){
  if(!maze){
    ctx.clearRect(0,0,canvas.width,canvas.height);
    ctx.fillStyle = getVar('--ink-dim');
    ctx.font = '14px ' + getVar('--mono').trim();
    ctx.textAlign = 'center';
    ctx.fillText('Open a maze JSON, or drop a file here', canvas.width/2, canvas.height/2);
    ctx.textAlign = 'start';
    return;
  }
  const {size, walls, start, goal, distances, path} = maze;
  const W_ = canvas.width, H_ = canvas.height;
  const cell = Math.floor(Math.min(W_,H_)/size);
  const originX = (W_-cell*size)/2, originY=(H_-cell*size)/2;
  ctx.clearRect(0,0,W_,H_);

  // heatmap layer
  if(document.getElementById('lyHeat').checked){
    let maxD=1;
    for(let y=0;y<size;y++) for(let x=0;x<size;x++) maxD=Math.max(maxD, distances[y][x]);
    for(let y=0;y<size;y++) for(let x=0;x<size;x++){
      const d=distances[y][x];
      if(d<0) continue;
      const t=d/maxD;
      ctx.fillStyle = lerpColor([0x27,0x4a,0x63], [0xe8,0xa3,0x3d], t);
      ctx.globalAlpha = 0.55;
      ctx.fillRect(originX+x*cell, originY+y*cell, cell, cell);
    }
    ctx.globalAlpha=1;
  }

  // grid
  ctx.strokeStyle = getVar('--grid');
  ctx.lineWidth=1;
  for(let i=0;i<=size;i++){
    ctx.beginPath();
    ctx.moveTo(originX+i*cell, originY);
    ctx.lineTo(originX+i*cell, originY+size*cell);
    ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(originX, originY+i*cell);
    ctx.lineTo(originX+size*cell, originY+i*cell);
    ctx.stroke();
  }

  // walls
  if(document.getElementById('lyWalls').checked){
    ctx.strokeStyle = getVar('--wall');
    ctx.lineWidth=3;
    ctx.lineCap='round';
    for(let y=0;y<size;y++) for(let x=0;x<size;x++){
      const wx=originX+x*cell, wy=originY+y*cell;
      const w=walls[y][x];
      ctx.beginPath();
      if(w & N){ ctx.moveTo(wx,wy); ctx.lineTo(wx+cell,wy); }
      if(w & S){ ctx.moveTo(wx,wy+cell); ctx.lineTo(wx+cell,wy+cell); }
      if(w & W){ ctx.moveTo(wx,wy); ctx.lineTo(wx,wy+cell); }
      if(w & E){ ctx.moveTo(wx+cell,wy); ctx.lineTo(wx+cell,wy+cell); }
      ctx.stroke();
    }
  }

  // start/goal markers
  ctx.fillStyle = getVar('--ink-dim');
  ctx.font = '10px ' + getVar('--mono').trim();
  ctx.fillText('S', originX+start.x*cell+cell/2-3, originY+start.y*cell+cell/2+3);
  ctx.fillStyle = getVar('--amber');
  ctx.fillText('G', originX+goal.x*cell+cell/2-3, originY+goal.y*cell+cell/2+3);

  // path overlay — drawn as individual segments so blocked diagonal cuts can be flagged in red
  if(document.getElementById('lyPath').checked && path && path.length>1){
    ctx.lineWidth = Math.max(2, cell*0.12);
    ctx.lineCap = 'round';
    for(let i=1;i<path.length;i++){
      const a=path[i-1], b=path[i];
      const ax=originX+a.x*cell+cell/2, ay=originY+a.y*cell+cell/2;
      const bx=originX+b.x*cell+cell/2, by=originY+b.y*cell+cell/2;
      const blocked = maze.badSegs && maze.badSegs.has(i);
      ctx.strokeStyle = blocked ? '#e06b5a' : getVar('--amber');
      ctx.globalAlpha = 0.85;
      ctx.beginPath();
      ctx.moveTo(ax,ay); ctx.lineTo(bx,by);
      ctx.stroke();
    }
    ctx.globalAlpha=1;
  }

  // mouse marker (interpolated along run_log by simTime)
  if(document.getElementById('lyMouse').checked && maze.run_log && maze.run_log.length){
    const pos = interpolatePosition(maze.run_log, simTime);
    const px=originX+pos.x*cell+cell/2, py=originY+pos.y*cell+cell/2;
    ctx.fillStyle = getVar('--amber');
    ctx.beginPath();
    ctx.arc(px,py, cell*0.28, 0, Math.PI*2);
    ctx.fill();
    ctx.strokeStyle = '#1a1206';
    ctx.lineWidth=1.5;
    ctx.stroke();
  }
}

function interpolatePosition(log, t){
  if(t<=log[0].t) return log[0];
  if(t>=log[log.length-1].t) return log[log.length-1];
  for(let i=0;i<log.length-1;i++){
    const a=log[i], b=log[i+1];
    if(t>=a.t && t<=b.t){
      const f = (b.t-a.t)>0 ? (t-a.t)/(b.t-a.t) : 0;
      return {x: a.x+(b.x-a.x)*f, y: a.y+(b.y-a.y)*f};
    }
  }
  return log[log.length-1];
}

function lerpColor(a,b,t){
  const r=Math.round(a[0]+(b[0]-a[0])*t);
  const g=Math.round(a[1]+(b[1]-a[1])*t);
  const bl=Math.round(a[2]+(b[2]-a[2])*t);
  return `rgb(${r},${g},${bl})`;
}
function getVar(name){ return getComputedStyle(document.documentElement).getPropertyValue(name); }

// ---------- playback ----------
function tick(ts){
  if(!lastFrame) lastFrame=ts;
  const dt=(ts-lastFrame)/1000;
  lastFrame=ts;
  if(playing && maze && maze.run_log.length){
    const speed = parseFloat(document.getElementById('speed').value);
    const maxT = maze.run_log[maze.run_log.length-1].t;
    simTime = Math.min(maxT, simTime + dt*speed);
    document.getElementById('scrubBar').value = simTime*1000;
    if(simTime>=maxT) playing=false, document.getElementById('playBtn').textContent='Play';
    render();
    updateStats();
  }
  requestAnimationFrame(tick);
}
requestAnimationFrame(tick);

function updateStats(){
  if(!maze) return;
  const el = document.getElementById('stats');
  const hasPath = maze.path.length > 0;
  const maxT = maze.run_log.length ? maze.run_log[maze.run_log.length-1].t : 0;
  const diagCount = maze.path.filter(p=>p.move==='diagonal').length;
  const shown = maze.issues.slice(0,6).map(i => `<br>• ${esc(i)}`).join('');
  const more = maze.issues.length>6 ? `<br>…and ${maze.issues.length-6} more` : '';
  el.innerHTML =
    `file: <b>${esc(maze.source)}</b><br>` +
    `size: <b>${maze.size}×${maze.size}</b><br>` +
    (hasPath
      ? `path length: <b>${maze.path.length}</b> cells<br>diagonal cuts: <b>${diagCount}</b><br>` +
        `run time: <b>${simTime.toFixed(2)}s</b> / ${maxT.toFixed(2)}s<br>`
      : `path: <b>none in this file</b><br>`) +
    `start: <b>(${maze.start.x},${maze.start.y})</b><br>` +
    `goal: <b>(${maze.goal.x},${maze.goal.y})</b>` +
    (maze.issues.length
      ? `<br><br><span style="color:#e06b5a;">⚠ ${maze.issues.length} problem${maze.issues.length>1?'s':''}${shown}${more}</span>`
      : (hasPath ? `<br><br><span style="color:#5fc48a;">✓ path is valid</span>` : ''));
  document.getElementById('scrubT').textContent = simTime.toFixed(2)+'s';
}

// ---------- controls ----------
document.getElementById('genBtn').onclick = ()=> newRandomMaze(16);
document.getElementById('playBtn').onclick = (e)=>{
  playing = !playing;
  e.target.textContent = playing ? 'Pause' : 'Play';
};
document.getElementById('stepBtn').onclick = ()=>{
  if(!maze) return;
  const idx = maze.run_log.findIndex(r=>r.t>simTime);
  if(idx>=0){ simTime = maze.run_log[idx].t; document.getElementById('scrubBar').value=simTime*1000; render(); updateStats(); }
};
document.getElementById('resetBtn').onclick = ()=>{
  simTime=0; playing=false;
  document.getElementById('playBtn').textContent='Play';
  document.getElementById('scrubBar').value=0;
  render(); updateStats();
};
document.getElementById('scrubBar').oninput = (e)=>{
  if(!maze) return;
  simTime = e.target.value/1000;
  playing=false;
  document.getElementById('playBtn').textContent='Play';
  render(); updateStats();
};
['lyWalls','lyHeat','lyPath','lyMouse'].forEach(id=>{
  document.getElementById(id).onchange = render;
});
document.getElementById('loadBtn').onclick = ()=> document.getElementById('fileInput').click();
document.getElementById('fileInput').onchange = (e)=>{
  const f = e.target.files[0];
  e.target.value = '';                                  // allow re-opening the same file
  if(f) loadFile(f);
};
window.addEventListener('dragover', e => e.preventDefault());
window.addEventListener('drop', e => {
  e.preventDefault();
  const f = e.dataTransfer.files[0];
  if(f) loadFile(f);
});

// ---------- init ----------
fitCanvas();
['playBtn','stepBtn','resetBtn','scrubBar'].forEach(id => document.getElementById(id).disabled = true);
render();
</script>
</body>
</html>
