<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Micromouse Simulator</title>
<style>
  :root{
    --bg:#0d131a;
    --panel:#121a23;
    --grid:#1f2b38;
    --wall:#8fc7e0;
    --wall-dim:#2c3d4c;
    --ink:#cdd8e0;
    --ink-dim:#6f818f;
    --amber:#e8a33d;
    --amber-dim:#5a4526;
    --near:#274a63;
    --far:#e8a33d;
    --mono: 'IBM Plex Mono', 'SF Mono', Menlo, Consolas, monospace;
    --sans: 'Inter', -apple-system, sans-serif;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--ink);
    font-family:var(--sans);
    display:flex;
    height:100vh;
    overflow:hidden;
  }
  #sidebar{
    width:280px;
    background:var(--panel);
    border-right:1px solid var(--grid);
    padding:20px;
    display:flex;
    flex-direction:column;
    gap:18px;
    overflow-y:auto;
  }
  h1{
    font-size:15px;
    font-weight:600;
    letter-spacing:0.02em;
    margin:0;
    color:var(--ink);
  }
  h1 span{color:var(--amber);}
  .sub{
    font-family:var(--mono);
    font-size:11px;
    color:var(--ink-dim);
    margin-top:2px;
  }
  .block{
    border-top:1px solid var(--grid);
    padding-top:14px;
  }
  .block-label{
    font-size:11px;
    color:var(--ink-dim);
    margin-bottom:10px;
    font-family:var(--mono);
  }
  .row{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:8px;
    margin-bottom:8px;
    font-size:13px;
  }
  .toggle{
    display:flex;
    align-items:center;
    gap:8px;
    cursor:pointer;
    user-select:none;
  }
  .toggle input{accent-color:var(--amber);}
  button{
    background:var(--grid);
    color:var(--ink);
    border:1px solid var(--wall-dim);
    border-radius:3px;
    padding:7px 10px;
    font-size:12px;
    font-family:var(--sans);
    cursor:pointer;
  }
  button:hover{border-color:var(--amber);}
  button.primary{
    background:var(--amber);
    color:#1a1206;
    border:none;
    font-weight:600;
  }
  .btn-row{display:flex;gap:6px;}
  .btn-row button{flex:1;}
  input[type=range]{
    width:100%;
    accent-color:var(--amber);
  }
  input[type=file]{display:none;}
  input[type=number]{
    width:100%; margin-top:8px;
    background:var(--grid); color:var(--ink);
    border:1px solid var(--wall-dim); border-radius:3px;
    padding:6px 8px; font-size:12px; font-family:var(--mono);
  }
  .filebtn{
    display:block;
    text-align:center;
  }
  #stats{
    font-family:var(--mono);
    font-size:11.5px;
    color:var(--ink-dim);
    line-height:1.9;
  }
  #stats b{color:var(--ink);font-weight:600;}
  #main{
    flex:1;
    display:flex;
    flex-direction:column;
    min-width:0;
  }
  #scrub{
    flex:0 0 auto;
    display:flex;
    align-items:center;
    gap:10px;
    padding:14px 24px;
    border-bottom:1px solid var(--grid);
    background:var(--panel);
  }
  #scrub span{
    font-family:var(--mono);
    font-size:11px;
    color:var(--ink-dim);
    width:48px;
    flex:0 0 auto;
  }
  #scrubBar{
    flex:1;
  }
  #canvasWrap{
    flex:1;
    display:flex;
    align-items:center;
    justify-content:center;
    min-height:0;
  }
  canvas{
    background:var(--bg);
  }
  button:disabled,input:disabled{opacity:.4;cursor:default;}
  .toggle:has(input:disabled){opacity:.4;cursor:default;}

  /* slim scrollbars in the theme colours (side panel and run log) */
  #sidebar, #logScroll{ scrollbar-width:thin; scrollbar-color:var(--wall-dim) transparent; }
  @supports selector(::-webkit-scrollbar){
    #sidebar, #logScroll{ scrollbar-width:auto; scrollbar-color:auto; }   /* let the rules below apply */
    #sidebar::-webkit-scrollbar, #logScroll::-webkit-scrollbar{ width:6px; height:6px; }
    #sidebar::-webkit-scrollbar-track, #logScroll::-webkit-scrollbar-track,
    #sidebar::-webkit-scrollbar-corner, #logScroll::-webkit-scrollbar-corner{ background:transparent; }
    #sidebar::-webkit-scrollbar-thumb, #logScroll::-webkit-scrollbar-thumb{
      background:var(--wall-dim); border:1px solid transparent; background-clip:padding-box; border-radius:4px;
    }
    #sidebar::-webkit-scrollbar-thumb:hover, #logScroll::-webkit-scrollbar-thumb:hover{ background:var(--ink-dim); background-clip:padding-box; }
    #sidebar::-webkit-scrollbar-thumb:active, #logScroll::-webkit-scrollbar-thumb:active{ background:var(--amber); background-clip:padding-box; }
  }
  #logPanel{
    flex:0 0 200px; display:flex; flex-direction:column; min-height:0;
    border-top:1px solid var(--grid); background:var(--panel);
  }
  #logHead{
    display:flex; align-items:center; gap:16px; padding:8px 24px;
    font-family:var(--mono); font-size:11px; color:var(--ink-dim);
  }
  #logHead .toggle{font-size:11px;}
  #logCount{margin-left:auto;}
  #logScroll{flex:1; overflow-y:auto; font-family:var(--mono); font-size:11.5px; padding:0 12px 8px; scroll-padding-top:28px;}
  .lrow, .lhead{
    display:grid; grid-template-columns:60px 54px 80px 64px 34px 1fr; gap:8px;
    padding:2px 12px; color:var(--ink-dim); white-space:nowrap; border-radius:2px;
  }
  .lrow{cursor:pointer;}
  .lhead{                                   /* stays pinned while the rows scroll underneath */
    position:sticky; top:0; z-index:1; margin-bottom:2px; padding-top:4px; padding-bottom:4px;
    background:var(--panel); border-bottom:1px solid var(--grid);
    font-size:10.5px; letter-spacing:.06em;
  }
  .lrow:hover{background:var(--grid);}
  .lrow.cur{background:var(--amber-dim); color:var(--ink);}
  .lrow .note{color:var(--ink-dim); overflow:hidden; text-overflow:ellipsis;}
  .lrow.ev .note{color:var(--amber);}
  .lrow.bad .note{color:#e06b5a;}
  body.events-only .lrow:not(.ev){display:none;}
</style>
</head>
<body>

<div id="sidebar">
  <div>
    <h1>maze<span>sim</span></h1>
    <div class="sub">micromouse simulator tool</div>
  </div>

  <div class="block">
    <div class="block-label">SOURCE</div>
    <div class="btn-row">
      <button class="primary" id="loadBtn">Open maze JSON</button>
    </div>
    <div class="sub" style="margin-top:8px;">or drop a .json file anywhere</div>
    <div id="msg" role="alert" style="color:#e06b5a;font-size:12px;margin-top:8px;"></div>
    <input type="file" id="fileInput" accept=".json,application/json">
  </div>

  <div class="block" id="liveBlock" style="display:none">
    <div class="block-label">LIVE SIM</div>
    <div class="row"><label class="toggle"><input type="checkbox" id="optLive" checked>Run in simulator</label></div>
    <div class="row"><label class="toggle"><input type="checkbox" id="optRotate">Random start corner</label></div>
    <div class="btn-row"><button id="genCBtn">Generate maze</button></div>
    <div style="display:flex;gap:8px;">
      <input type="number" id="genSize" value="16" min="3" max="64" step="1" title="maze size (N x N)" style="min-width:0;">
      <input type="number" id="genSeed" placeholder="seed (blank = random)" min="0" step="1" title="maze seed" style="min-width:0;">
    </div>
    <div class="btn-row" style="margin-top:10px;"><button id="exportBtn">Export maze</button></div>
    <div class="sub" id="seedInfo" style="margin-top:8px; white-space:pre-line;"></div>
    <div class="sub" id="exportInfo" style="margin-top:6px; word-break:break-all;"></div>
  </div>

  <div class="block">
    <div class="block-label">LAYERS</div>
    <div class="row"><label class="toggle" title="The mouse's cost for each cell (shown when the firmware provides distances)"><input type="checkbox" id="lyHeat">Distances</label></div>
    <div class="row"><label class="toggle" title="The path the mouse intends to take (shown when the firmware provides a plan)"><input type="checkbox" id="lyPath" checked>Path</label></div>
  </div>

  <div class="block">
    <div class="block-label">PLAYBACK</div>
    <div class="btn-row">
      <button id="playBtn" class="primary">Play</button>
      <button id="stepBtn">Step</button>
      <button id="resetBtn">Reset</button>
    </div>
    <div class="row" style="margin-top:12px;">
      <span style="font-size:11px;color:var(--ink-dim);">Speed</span>
    </div>
    <input type="range" id="speed" min="0.25" max="8" step="0.25" value="2">
  </div>

  <div class="block">
    <div class="block-label">TELEMETRY</div>
    <div id="stats"></div>
  </div>
</div>

<div id="main">
  <div id="scrub">
    <span id="scrubT">0.00s</span>
    <input type="range" id="scrubBar" min="0" max="100" value="0">
  </div>
  <div id="canvasWrap">
    <canvas id="cv"></canvas>
  </div>
  <div id="logPanel">
    <div id="logHead">
      <span>RUN LOG</span>
      <label class="toggle"><input type="checkbox" id="logEvents">Events only</label>
      <span id="logCount"></span>
    </div>
    <div id="logScroll">
      <div class="lhead"><span id="logColT">STEP</span><span>SENSED</span><span>ACTION</span><span>POS</span><span>HDG</span><span>NOTES</span></div>
      <div id="logBody"></div>
    </div>
  </div>
</div>

<script>
// ---------- data model ----------
// walls bitmask per cell: bit3=N(8) bit2=E(4) bit1=S(2) bit0=W(1)  (matches C engine convention)
const N=8,E=4,S=2,W=1;
const OPP={ [N]:S, [S]:N, [E]:W, [W]:E };

let maze = null; // {size, walls, start, goal, distances, path, run_log}
let playing = false;
let simTime = 0;
let lastFrame = null;
let live=null, src=null, srcName='', srcSeed=null, rotSeed=null, busy=false, acc=0;   // live = {hist:[frames], idx, over}

const canvas = document.getElementById('cv');
const ctx = canvas.getContext('2d');

function fitCanvas(){
  const wrap = document.getElementById('canvasWrap');
  const pad = 40;
  const avail = Math.min(wrap.clientWidth, wrap.clientHeight) - pad;
  canvas.width = avail; canvas.height = avail;
}
window.addEventListener('resize', ()=>{ fitCanvas(); render(); });

function bfsDistances(walls, size, goal){
  const dist = Array.from({length:size}, ()=>Array(size).fill(-1));
  dist[goal.y][goal.x]=0;
  const q=[[goal.x,goal.y]];
  const dirs=[[0,-1,N,S],[0,1,S,N],[1,0,E,W],[-1,0,W,E]];
  let head=0;
  while(head<q.length){
    const [x,y]=q[head++];
    for(const [dx,dy,dir,rev] of dirs){
      const nx=x+dx, ny=y+dy;
      if(nx<0||ny<0||nx>=size||ny>=size) continue;
      if(walls[y][x] & dir) continue; // wall blocks this direction from (x,y)
      if(dist[ny][nx]!==-1) continue;
      dist[ny][nx]=dist[y][x]+1;
      q.push([nx,ny]);
    }
  }
  return dist;
}

function reconstructPath(walls, size, start, goal, dist){
  const path=[{x:start.x,y:start.y}];
  let cx=start.x, cy=start.y;
  const dirs=[[0,-1,N],[0,1,S],[1,0,E],[-1,0,W]];
  let guard=0;
  while((cx!==goal.x||cy!==goal.y) && guard++<size*size*2){
    let best=null, bestD=Infinity;
    for(const [dx,dy,dir] of dirs){
      if(walls[cy][cx] & dir) continue;
      const nx=cx+dx, ny=cy+dy;
      if(nx<0||ny<0||nx>=size||ny>=size) continue;
      if(dist[ny][nx]>=0 && dist[ny][nx]<bestD){ bestD=dist[ny][nx]; best=[nx,ny]; }
    }
    if(!best) break;
    cx=best[0]; cy=best[1];
    path.push({x:cx,y:cy});
  }
  return path;
}

function cornerOpen(walls, size, x, y, dx, dy){
  // diagonal cut from (x,y) to (x+dx,y+dy) is only legal if both orthogonal
  // walls forming the corner are open (matches maze_json_format.md's rule)
  const nx=x+dx, ny=y+dy;
  if(nx<0||ny<0||nx>=size||ny>=size) return false;
  const horiz = dx>0 ? E : W;      // wall from (x,y) toward (x+dx,y)
  const vert  = dy>0 ? S : N;      // wall from (x,y) toward (x,y+dy)
  const horizOpen = !(walls[y][x] & horiz);
  const vertOpen  = !(walls[y][x] & vert);
  return horizOpen && vertOpen;
}

const esc = t => String(t).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

function decodeText(buf){
  // files written by PowerShell redirection are UTF-16 with a BOM; handle that and plain UTF-8
  const b = new Uint8Array(buf);
  if(b[0]===0xFF && b[1]===0xFE) return new TextDecoder('utf-16le').decode(b.subarray(2));
  if(b[0]===0xFE && b[1]===0xFF) return new TextDecoder('utf-16be').decode(b.subarray(2));
  return new TextDecoder('utf-8').decode(b);
}

function structureError(d){
  if(!d || typeof d!=='object' || Array.isArray(d)) return 'top level must be a JSON object';
  for(const k of ['size','walls','start','goal']) if(!(k in d)) return `missing required key "${k}"`;
  const n = d.size;
  if(!Number.isInteger(n) || n<1) return '"size" must be a positive integer';
  const grid = (g, ok) => Array.isArray(g) && g.length===n && g.every(r => Array.isArray(r) && r.length===n && r.every(ok));
  if(!grid(d.walls, v => Number.isInteger(v) && v>=0 && v<=15)) return `"walls" must be a ${n}×${n} grid of integers 0–15`;
  for(const k of ['start','goal']){
    const p = d[k];
    if(!p || !Number.isInteger(p.x) || !Number.isInteger(p.y) || p.x<0 || p.y<0 || p.x>=n || p.y>=n) return `"${k}" must be {"x","y"} inside the maze`;
  }
  if('distances' in d && !grid(d.distances, v => Number.isInteger(v))) return `"distances" must be a ${n}×${n} grid of integers`;
  if('path' in d && !(Array.isArray(d.path) && d.path.every(p => p && typeof p.x==='number' && typeof p.y==='number'))) return '"path" must be a list of {"x","y"}';
  if('run_log' in d && !(Array.isArray(d.run_log) && d.run_log.every(r => r && ['t','x','y'].every(k => typeof r[k]==='number')))) return '"run_log" must be a list of {"t","x","y"}';
  return null;
}

function wallIssues(walls, size){
  const out = [];
  for(let y=0;y<size;y++) for(let x=0;x<size;x++){
    const w = walls[y][x];
    if(x+1<size && !!(w&E) !== !!(walls[y][x+1]&W)) out.push(`one-sided wall between (${x},${y}) and (${x+1},${y})`);
    if(y+1<size && !!(w&S) !== !!(walls[y+1][x]&N)) out.push(`one-sided wall between (${x},${y}) and (${x},${y+1})`);
  }
  return out;
}

function validatePath(m){
  const {walls, size, path, start, goal} = m, issues = [], bad = new Set();
  if(!path.length) return {issues, bad};
  const out = path.findIndex(p => !(Number.isInteger(p.x) && Number.isInteger(p.y) && p.x>=0 && p.y>=0 && p.x<size && p.y<size));
  if(out>=0){ issues.push(`path step ${out} is outside the maze or off the cell grid`); bad.add(out); return {issues, bad}; }
  if(path[0].x!==start.x || path[0].y!==start.y) issues.push(`path starts at (${path[0].x},${path[0].y}), not the start cell`);
  const last = path[path.length-1];
  if(last.x!==goal.x || last.y!==goal.y) issues.push(`path ends at (${last.x},${last.y}), not the goal`);
  for(let i=1;i<path.length;i++){
    const a=path[i-1], b=path[i], dx=b.x-a.x, dy=b.y-a.y, ax=Math.abs(dx), ay=Math.abs(dy);
    if(ax+ay===0) continue;                                   // standing still is fine
    if(ax+ay===1){
      const dir = dx>0 ? E : dx<0 ? W : dy>0 ? S : N;
      if((walls[a.y][a.x] & dir) || (walls[b.y][b.x] & OPP[dir])){ issues.push(`step ${i}: (${a.x},${a.y}) to (${b.x},${b.y}) crosses a wall`); bad.add(i); }
    } else if(ax===1 && ay===1){
      if(b.move!=='diagonal'){ issues.push(`step ${i}: diagonal step is not marked "move":"diagonal"`); bad.add(i); }
      else if(!cornerOpen(walls,size,a.x,a.y,dx,dy)){ issues.push(`step ${i}: diagonal cut through a blocked corner`); bad.add(i); }
    } else { issues.push(`step ${i}: (${a.x},${a.y}) to (${b.x},${b.y}) is not adjacent`); bad.add(i); }
  }
  return {issues, bad};
}

function setMaze(m, source){
  const pv = validatePath(m);
  m.issues = pv.issues.concat(wallIssues(m.walls, m.size));
  { const edge = [0, m.size-1];
    if(!(edge.includes(m.start.x) && edge.includes(m.start.y)))
      m.issues.push('start must be a corner cell (the sim derives the mouse frame from it)'); }
  if(m.distances[m.start.y][m.start.x] < 0) m.issues.unshift('goal is unreachable from the start cell');
  m.badSegs = pv.bad;
  m.source = source;
  maze = m; simTime = 0; playing = false; live = null; logBuildFile();
  const has = m.run_log.length > 0;
  document.getElementById('playBtn').textContent = 'Play';
  ['playBtn','stepBtn','resetBtn','scrubBar'].forEach(id => document.getElementById(id).disabled = !has);
  const bar = document.getElementById('scrubBar');
  bar.max = has ? m.run_log[m.run_log.length-1].t*1000 : 0;
  bar.value = 0;
  document.getElementById('msg').textContent = '';
  render(); updateStats();
}

async function loadFile(f){
  try{
    const data = JSON.parse(decodeText(await f.arrayBuffer()));
    const err = structureError(data);
    if(err) throw new Error(err);
    const path = data.path || [];
    setMaze({
      size: data.size, walls: data.walls, start: data.start, goal: data.goal,
      distances: data.distances || bfsDistances(data.walls, data.size, data.goal),
      path,
      run_log: data.run_log || (path.length ? buildRunLog(path, 0.18) : [])   // path-only files replay at a constant 0.18 s per cell
    }, f.name);
    src = {size:data.size, walls:data.walls, start:data.start, goal:data.goal, heading:data.heading}; srcName = f.name; srcSeed = null; maybeLive();
  }catch(e){
    document.getElementById('msg').textContent = `Could not load ${f.name}: ${e.message}`;
  }
}

function buildRunLog(path, cellTime){
  // demo timing: constant time per cell — replace with real kinematics output when available
  return path.map((p,i)=>({t: +(i*cellTime).toFixed(3), x:p.x, y:p.y}));
}

// ---------- rendering ----------
function render(){
  if(!maze){
    ctx.clearRect(0,0,canvas.width,canvas.height);
    ctx.fillStyle = getVar('--ink-dim');
    ctx.font = '14px ' + getVar('--mono').trim();
    ctx.textAlign = 'center';
    ctx.fillText('Open a maze JSON, or drop a file here', canvas.width/2, canvas.height/2);
    ctx.textAlign = 'start';
    return;
  }
  const {size, walls, start, goal, distances, path} = maze;
  const fr = curFrame();
  const dist = live ? (fr && fr.dist) : distances;   // live: the mouse's own cost per cell (never the oracle)
  const plan = live ? null : path;                   // replay: the file's path (the mouse's plan is drawn in drawLive)
  const W_ = canvas.width, H_ = canvas.height;
  const cell = Math.floor(Math.min(W_,H_)/size);
  const originX = (W_-cell*size)/2, originY=(H_-cell*size)/2;
  ctx.clearRect(0,0,W_,H_);

  // heatmap layer
  if(document.getElementById('lyHeat').checked && dist){
    let maxD=1;
    for(let y=0;y<size;y++) for(let x=0;x<size;x++) maxD=Math.max(maxD, dist[y][x]);
    for(let y=0;y<size;y++) for(let x=0;x<size;x++){
      const d=dist[y][x];
      if(d<0) continue;
      const t=d/maxD;
      ctx.fillStyle = lerpColor([0x27,0x4a,0x63], [0xe8,0xa3,0x3d], t);
      ctx.globalAlpha = 0.55;
      ctx.fillRect(originX+x*cell, originY+y*cell, cell, cell);
    }
    ctx.globalAlpha=1;
  }

  // grid
  ctx.strokeStyle = getVar('--grid');
  ctx.lineWidth=1;
  for(let i=0;i<=size;i++){
    ctx.beginPath();
    ctx.moveTo(originX+i*cell, originY);
    ctx.lineTo(originX+i*cell, originY+size*cell);
    ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(originX, originY+i*cell);
    ctx.lineTo(originX+size*cell, originY+i*cell);
    ctx.stroke();
  }

  // walls: the true maze dimmed; what the mouse remembers drawn solid over it
  // (red where its memory has a wall the maze doesn't)
  {
    const mem = fr && fr.known;
    drawWallBits((x,y)=>walls[y][x], getVar(mem ? '--wall-dim' : '--wall'), originX, originY, cell, size);
    if(mem){
      drawWallBits((x,y)=>(mem[y][x] & 15) & walls[y][x], getVar('--wall'), originX, originY, cell, size);
      drawWallBits((x,y)=>(mem[y][x] & 15) & ~walls[y][x], '#e06b5a', originX, originY, cell, size);
    }
  }

  // start/goal markers
  ctx.fillStyle = getVar('--ink-dim');
  ctx.font = '10px ' + getVar('--mono').trim();
  ctx.fillText('S', originX+start.x*cell+cell/2-3, originY+start.y*cell+cell/2+3);
  ctx.fillStyle = getVar('--amber');
  ctx.fillText('G', originX+goal.x*cell+cell/2-3, originY+goal.y*cell+cell/2+3);

  // intended path — dashed, drawn as segments so blocked diagonal cuts (replay files) can be flagged in red
  if(document.getElementById('lyPath').checked && plan && plan.length>1){
    ctx.setLineDash([cell*0.2, cell*0.14]);
    ctx.lineWidth = Math.max(2, cell*0.12);
    ctx.lineCap = 'round';
    for(let i=1;i<plan.length;i++){
      const a=plan[i-1], b=plan[i];
      const ax=originX+a.x*cell+cell/2, ay=originY+a.y*cell+cell/2;
      const bx=originX+b.x*cell+cell/2, by=originY+b.y*cell+cell/2;
      const blocked = !live && maze.badSegs && maze.badSegs.has(i);
      ctx.strokeStyle = blocked ? '#e06b5a' : getVar('--wall');
      ctx.globalAlpha = 0.85;
      ctx.beginPath();
      ctx.moveTo(ax,ay); ctx.lineTo(bx,by);
      ctx.stroke();
    }
    ctx.globalAlpha=1;
    ctx.setLineDash([]);
  }

  drawLive(originX, originY, cell);
  drawReplay(originX, originY, cell);
}

const HVEC = {N:[0,-1], E:[1,0], S:[0,1], W:[-1,0]};
function curFrame(){ return live ? live.hist[live.idx] : null; }

function drawWallBits(get, color, ox, oy, cell, size){
  ctx.strokeStyle = color; ctx.lineWidth = 3; ctx.lineCap = 'round';
  for(let y=0;y<size;y++) for(let x=0;x<size;x++){
    const wx=ox+x*cell, wy=oy+y*cell, w=get(x,y);
    ctx.beginPath();
    if(w & N){ ctx.moveTo(wx,wy); ctx.lineTo(wx+cell,wy); }
    if(w & S){ ctx.moveTo(wx,wy+cell); ctx.lineTo(wx+cell,wy+cell); }
    if(w & W){ ctx.moveTo(wx,wy); ctx.lineTo(wx,wy+cell); }
    if(w & E){ ctx.moveTo(wx+cell,wy); ctx.lineTo(wx+cell,wy+cell); }
    ctx.stroke();
  }
}

const HDG = {N:[0,-1], NE:[1,-1], E:[1,0], SE:[1,1], S:[0,1], SW:[-1,1], W:[-1,0], NW:[-1,-1]};

function triPath(px, py, vec, r){                         // isosceles triangle centred on (px,py), apex along vec
  const len = Math.hypot(vec[0], vec[1]) || 1, fx = vec[0]/len, fy = vec[1]/len;
  const sx = -fy, sy = fx;                              // perpendicular to the heading
  ctx.beginPath();
  ctx.moveTo(px + fx*r*1.2, py + fy*r*1.2);
  ctx.lineTo(px - fx*r*0.8 + sx*r*0.75, py - fy*r*0.8 + sy*r*0.75);
  ctx.lineTo(px - fx*r*0.8 - sx*r*0.75, py - fy*r*0.8 - sy*r*0.75);
  ctx.closePath();
}

function drawMouse(px, py, vec, cell, failed){          // the mouse: solid triangle
  ctx.fillStyle = failed ? '#e06b5a' : getVar('--amber');
  ctx.strokeStyle = '#1a1206'; ctx.lineWidth = 1.5; ctx.lineJoin = 'round';
  triPath(px, py, vec, cell*0.3); ctx.fill(); ctx.stroke();
}

function drawTrail(pts, ox, oy, cell){                  // the path the mouse has travelled
  if(pts.length < 2) return;
  ctx.strokeStyle = getVar('--amber'); ctx.globalAlpha = 0.5; ctx.lineJoin = 'round'; ctx.lineCap = 'round';
  ctx.lineWidth = Math.max(2, cell*0.1); ctx.beginPath();
  pts.forEach((p, i) => {
    const x = ox + p.x*cell + cell/2, y = oy + p.y*cell + cell/2;
    i ? ctx.lineTo(x, y) : ctx.moveTo(x, y);
  });
  ctx.stroke(); ctx.globalAlpha = 1;
}

function drawLive(ox, oy, cell){
  const fr = curFrame(); if(!fr) return;
  const c = p => [ox+p.x*cell+cell/2, oy+p.y*cell+cell/2];
  drawTrail(live.hist.slice(0, live.idx+1).map(f => f.pos), ox, oy, cell);
  // the mouse's belief: its intended path (dotted) and its believed pose (hollow triangle) share one colour,
  // green normally and red when the believed pose disagrees with the truth. The path is drawn as the mouse
  // knows it, with no check against the real walls.
  const beliefColor = (fr.believed && beliefOff(fr)) ? '#e06b5a' : '#5fc48a';
  if(document.getElementById('lyPath').checked && fr.plan && fr.plan.length > 1){
    ctx.save();
    ctx.strokeStyle = beliefColor; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
    ctx.lineWidth = Math.max(2, cell*0.09); ctx.setLineDash([0.1, cell*0.16]);
    ctx.beginPath();
    fr.plan.forEach((p, i) => { const [x,y] = c(p); i ? ctx.lineTo(x, y) : ctx.moveTo(x, y); });
    ctx.stroke(); ctx.restore();
  }
  if(fr.believed){                                      // hollow triangle at the believed pose
    const b = fr.believed, [bx,by] = c(b.pos);
    ctx.strokeStyle = beliefColor; ctx.lineWidth = 2; ctx.lineJoin = 'round';
    triPath(bx, by, HDG[b.heading], cell*0.3*1.5); ctx.stroke();
  }
  const [px,py] = c(fr.pos);
  drawMouse(px, py, HDG[fr.heading], cell, !(fr.status==='running' || fr.status==='done'));
}

function drawReplay(ox, oy, cell){                      // file replay: marker interpolated along run_log
  const lg = maze.run_log; if(live || !lg || !lg.length) return;
  let i = 0; while(i+1 < lg.length && lg[i+1].t <= simTime) i++;
  const a = lg[i], b = lg[i+1], pos = interpolatePosition(lg, simTime);
  let vec = HDG[a.heading] || [1,0];
  if(b && (b.x!==a.x || b.y!==a.y)) vec = [b.x-a.x, b.y-a.y];
  drawTrail(lg.slice(0, i+1).concat([pos]), ox, oy, cell);
  drawMouse(ox+pos.x*cell+cell/2, oy+pos.y*cell+cell/2, vec, cell, false);
}

// ---------- run log ----------
// rows: step/time | sensed walls (L/F/R, relative to the mouse) | action | position | heading | notes
const logBody = document.getElementById('logBody');
let logCur = -1;

function mkRow(i, cols, note, cls){
  const r = document.createElement('div');
  r.className = 'lrow' + (cls ? ' ' + cls : ''); r.dataset.i = i;
  cols.concat([note]).forEach((t, k) => {
    const s = document.createElement('span'); if(k === 5) s.className = 'note';
    s.textContent = t; r.appendChild(s);
  });
  return r;
}
function logClear(){
  logBody.innerHTML = ''; logCur = -1; document.getElementById('logCount').textContent = '';
  document.getElementById('logColT').textContent = 'STEP';
}
const sensedStr = w => w == null ? '' : ((w&1?'L':'') + (w&8?'F':'') + (w&4?'R':'') || '·');
const beliefOff = f => f.believed && (f.believed.pos.x!==f.pos.x || f.believed.pos.y!==f.pos.y || f.believed.heading!==f.heading);

function frameNotes(prev, f){
  const n = []; let bad = false;
  if(!prev) return {notes:['start'], bad:false};
  if(f.believed && !prev.believed) n.push('heading resolved: ' + f.believed.heading);
  if(f.goal_reached && !prev.goal_reached) n.push('goal reached');
  if(beliefOff(f) && !beliefOff(prev)){ n.push('belief diverged'); bad = true; }
  if(!beliefOff(f) && beliefOff(prev)) n.push('belief recovered');
  if(f.status !== 'running'){ n.push(f.status + (f.message ? ': ' + f.message : '')); bad = bad || f.status !== 'done'; }
  return {notes:n, bad};
}
function logAdd(i){                                    // live: one row per simulated step
  const f = live.hist[i], {notes, bad} = frameNotes(i ? live.hist[i-1] : null, f);
  logBody.appendChild(mkRow(i, ['#'+f.step, sensedStr(f.sensed), f.action || '—',
      `(${f.pos.x},${f.pos.y})`, f.heading], notes.join(' · '), (notes.length ? 'ev' : '') + (bad ? ' bad' : '')));
  document.getElementById('logCount').textContent = i + ' steps';
}
function logBuildFile(){                               // file replay: one row per run_log waypoint
  logClear();
  const lg = maze.run_log; if(!lg.length) return;
  document.getElementById('logColT').textContent = 'TIME';
  const frag = document.createDocumentFragment(), p2 = v => +(+v).toFixed(2);
  lg.forEach((r, i) => {
    const prev = i ? lg[i-1] : null;
    const act = !prev ? 'start' : (r.x!==prev.x || r.y!==prev.y) ? 'MOVE' : (r.heading!==prev.heading ? 'TURN' : 'WAIT');
    const note = !prev ? 'start' : (i === lg.length-1 ? 'end of log' : '');
    frag.appendChild(mkRow(i, [r.t.toFixed(2)+'s', '', act, `(${p2(r.x)},${p2(r.y)})`, r.heading || ''], note, note ? 'ev' : ''));
  });
  logBody.appendChild(frag);
  document.getElementById('logCount').textContent = lg.length + ' waypoints';
}
function logCursor(i){
  const rows = logBody.children;
  if(logCur >= 0 && rows[logCur]) rows[logCur].classList.remove('cur');
  const r = rows[i]; if(!r) return;
  r.classList.add('cur'); r.scrollIntoView({block:'nearest'}); logCur = i;
}
function logSync(){                                    // follow the scrub position / playback
  let i;
  if(live) i = live.idx;
  else if(maze && maze.run_log.length){
    const lg = maze.run_log; i = 0;
    while(i+1 < lg.length && lg[i+1].t <= simTime) i++;
  } else return;
  if(i !== logCur) logCursor(i);
}
logBody.addEventListener('click', e => {               // click a row to jump there
  const r = e.target.closest('.lrow'); if(!r || !maze) return;
  const i = +r.dataset.i;
  playing = false; document.getElementById('playBtn').textContent = 'Play';
  if(live){ live.idx = i; syncLive(); }
  else if(maze.run_log.length){
    simTime = maze.run_log[i].t; document.getElementById('scrubBar').value = simTime*1000; render(); updateStats();
  }
});
document.getElementById('logEvents').onchange = e => document.body.classList.toggle('events-only', e.target.checked);

// ---------- live session (talks to Python through pywebview.api) ----------
const HAS_API = () => !!(window.pywebview && window.pywebview.api);
function maybeLive(reuseRotation=false){ if(src && HAS_API() && document.getElementById('optLive').checked) startLive(reuseRotation); }

async function startLive(reuseRotation=false){
  try{
    const r = await pywebview.api.start(src, {random_corner: document.getElementById('optRotate').checked,
                                              rotation_seed: reuseRotation ? rotSeed : null});
    if(r.error) throw new Error(r.error);
    rotSeed = r.seed;
    const m = r.maze;
    setMaze({size:m.size, walls:m.walls, start:m.start, goal:m.goal,
             distances:bfsDistances(m.walls, m.size, m.goal), path:[], run_log:[]}, srcName);
    live = {hist:[r.frame], idx:0, over:false};
    logClear(); logAdd(0);
    document.getElementById('seedInfo').textContent =
      `maze seed: ${srcSeed ?? 'n/a (loaded maze)'}\n` +
      (document.getElementById('optRotate').checked ? `rotation seed: ${r.seed}\n` : 'rotation: off\n') +
      `frame ${r.mouse_frame}° · facing ${r.start_heading}`;
    ['playBtn','stepBtn','resetBtn','scrubBar'].forEach(id => document.getElementById(id).disabled = false);
    syncLive();
  }catch(e){ document.getElementById('msg').textContent = 'Sim error: ' + e.message; }
}

async function liveAdvance(){
  if(busy || !live) return;
  busy = true;
  try{
    if(live.idx < live.hist.length-1) live.idx++;                 // replaying already-simulated steps
    else if(!live.over){
      const f = await pywebview.api.step();
      if(f.error) throw new Error(f.error);
      live.hist.push(f); live.idx = live.hist.length-1; logAdd(live.idx);
      if(f.status !== 'running') live.over = true;
    }
    else playing = false;
  }catch(e){ playing = false; document.getElementById('msg').textContent = 'Sim error: ' + e.message; }
  finally{ busy = false; }
  syncLive();
}

function syncLive(){
  const bar = document.getElementById('scrubBar');
  bar.max = live.hist.length-1; bar.value = live.idx;
  if(live.over && live.idx === live.hist.length-1) playing = false;
  document.getElementById('playBtn').textContent = playing ? 'Pause' : 'Play';
  render(); updateStats();
}

function interpolatePosition(log, t){
  if(t<=log[0].t) return log[0];
  if(t>=log[log.length-1].t) return log[log.length-1];
  for(let i=0;i<log.length-1;i++){
    const a=log[i], b=log[i+1];
    if(t>=a.t && t<=b.t){
      const f = (b.t-a.t)>0 ? (t-a.t)/(b.t-a.t) : 0;
      return {x: a.x+(b.x-a.x)*f, y: a.y+(b.y-a.y)*f};
    }
  }
  return log[log.length-1];
}

function lerpColor(a,b,t){
  const r=Math.round(a[0]+(b[0]-a[0])*t);
  const g=Math.round(a[1]+(b[1]-a[1])*t);
  const bl=Math.round(a[2]+(b[2]-a[2])*t);
  return `rgb(${r},${g},${bl})`;
}
function getVar(name){ return getComputedStyle(document.documentElement).getPropertyValue(name); }

// ---------- playback ----------
function tick(ts){
  if(!lastFrame) lastFrame=ts;
  const dt=(ts-lastFrame)/1000;
  lastFrame=ts;
  if(playing && live){                                   // live: speed slider = 5 sim steps/s per 1x
    acc += dt*parseFloat(document.getElementById('speed').value)*5;
    if(acc>=1){ acc = Math.min(acc-1, 1); liveAdvance(); }
  }
  if(playing && maze && maze.run_log.length){
    const speed = parseFloat(document.getElementById('speed').value);
    const maxT = maze.run_log[maze.run_log.length-1].t;
    simTime = Math.min(maxT, simTime + dt*speed);
    document.getElementById('scrubBar').value = simTime*1000;
    if(simTime>=maxT) playing=false, document.getElementById('playBtn').textContent='Play';
    render();
    updateStats();
  }
  requestAnimationFrame(tick);
}
requestAnimationFrame(tick);

function syncLayerControls(){
  const fr = curFrame();
  const hasDist = !!maze && (live ? !!(fr && fr.dist) : !!maze.distances);
  const hasPlan = !!maze && (live ? !!(fr && fr.plan) : !!(maze.path && maze.path.length > 1));
  document.getElementById('lyHeat').disabled = !hasDist;
  document.getElementById('lyPath').disabled = !hasPlan;
}

function updateStats(){
  logSync(); syncLayerControls();
  if(!maze) return;
  const el = document.getElementById('stats');
  const hasPath = maze.path.length > 0;
  const maxT = maze.run_log.length ? maze.run_log[maze.run_log.length-1].t : 0;
  const diagCount = maze.path.filter(p=>p.move==='diagonal').length;
  const shown = maze.issues.slice(0,6).map(i => `<br>• ${esc(i)}`).join('');
  const more = maze.issues.length>6 ? `<br>…and ${maze.issues.length-6} more` : '';
  const fr = curFrame();
  if(fr){
    const seen = fr.known ? fr.known.flat().filter(k=>k!==0).length : null;
    const ok = fr.status==='running' || fr.status==='done';
    el.innerHTML =
      `source: <b>${esc(maze.source)}</b><br>size: <b>${maze.size}×${maze.size}</b><br>` +
      `step: <b>${fr.step}</b> / ${live.hist.length-1}<br>action: <b>${esc(fr.action||'—')}</b><br>` +
      `pos: <b>(${fr.pos.x},${fr.pos.y})</b> facing <b>${fr.heading}</b><br>` +
      `believed heading: <b>${fr.believed ? fr.believed.heading : 'unresolved'}</b><br>` +
      `cells mapped: <b>${seen===null ? 'n/a' : seen}</b><br>` +
      `path: <b>${fr.plan ? fr.plan.length + ' cells' : 'none'}</b><br>` +
      `goal: <b>${fr.goal_reached ? 'reached @ step '+fr.goal_step : 'not yet'}</b><br>` +
      `status: <b style="color:${ok?'#5fc48a':'#e06b5a'}">${esc(fr.status)}</b>` +
      (fr.message ? `<br>${esc(fr.message)}` : '') +
      (maze.issues.length ? `<br><br><span style="color:#e06b5a;">⚠ ${maze.issues.length} problem${maze.issues.length>1?'s':''}${shown}${more}</span>` : '');
    document.getElementById('scrubT').textContent = '#'+live.idx;
    return;
  }
  el.innerHTML =
    `file: <b>${esc(maze.source)}</b><br>` +
    `size: <b>${maze.size}×${maze.size}</b><br>` +
    (hasPath
      ? `path length: <b>${maze.path.length}</b> cells<br>diagonal cuts: <b>${diagCount}</b><br>` +
        `run time: <b>${simTime.toFixed(2)}s</b> / ${maxT.toFixed(2)}s<br>`
      : `path: <b>none in this file</b><br>`) +
    `start: <b>(${maze.start.x},${maze.start.y})</b><br>` +
    `goal: <b>(${maze.goal.x},${maze.goal.y})</b>` +
    (maze.issues.length
      ? `<br><br><span style="color:#e06b5a;">⚠ ${maze.issues.length} problem${maze.issues.length>1?'s':''}${shown}${more}</span>`
      : (hasPath ? `<br><br><span style="color:#5fc48a;">✓ path is valid</span>` : ''));
  document.getElementById('scrubT').textContent = simTime.toFixed(2)+'s';
}

// ---------- controls ----------
document.getElementById('playBtn').onclick = (e)=>{
  playing = !playing;
  e.target.textContent = playing ? 'Pause' : 'Play';
};
document.getElementById('stepBtn').onclick = ()=>{
  if(!maze) return;
  if(live){ playing=false; liveAdvance(); return; }
  const idx = maze.run_log.findIndex(r=>r.t>simTime);
  if(idx>=0){ simTime = maze.run_log[idx].t; document.getElementById('scrubBar').value=simTime*1000; render(); updateStats(); }
};
document.getElementById('resetBtn').onclick = ()=>{
  if(live){ playing=false; maybeLive(true); return; }        // restart the same maze with the same start corner
  simTime=0; playing=false;
  document.getElementById('playBtn').textContent='Play';
  document.getElementById('scrubBar').value=0;
  render(); updateStats();
};
document.getElementById('scrubBar').oninput = (e)=>{
  if(!maze) return;
  if(live){ live.idx = +e.target.value; playing=false; syncLive(); return; }
  simTime = e.target.value/1000;
  playing=false;
  document.getElementById('playBtn').textContent='Play';
  render(); updateStats();
};
['lyHeat','lyPath'].forEach(id=>{
  document.getElementById(id).onchange = render;
});
document.getElementById('loadBtn').onclick = ()=> document.getElementById('fileInput').click();
document.getElementById('fileInput').onchange = (e)=>{
  const f = e.target.files[0];
  e.target.value = '';                                  // allow re-opening the same file
  if(f) loadFile(f);
};
window.addEventListener('dragover', e => e.preventDefault());
window.addEventListener('drop', e => {
  e.preventDefault();
  const f = e.dataTransfer.files[0];
  if(f) loadFile(f);
});

// ---------- init ----------
const onApiReady = () => document.getElementById('liveBlock').style.display = 'block';
window.addEventListener('pywebviewready', onApiReady);
if(HAS_API()) onApiReady();
document.getElementById('genCBtn').onclick = async ()=>{      // maze from the C generator library
  if(!HAS_API()) return;
  const v = document.getElementById('genSeed').value;
  const sz = parseInt(document.getElementById('genSize').value, 10) || 16;
  try{
    const r = await pywebview.api.generate_maze(sz, v==='' ? null : parseInt(v,10));
    if(r.error) throw new Error(r.error);
    src = r.maze; srcSeed = r.seed; srcName = `generated (seed ${r.seed})`;
    if(document.getElementById('optLive').checked) maybeLive();
    else { const m = r.maze; setMaze({size:m.size, walls:m.walls, start:m.start, goal:m.goal,
                 distances:bfsDistances(m.walls,m.size,m.goal), path:[], run_log:[]}, srcName); }
  }catch(e){ document.getElementById('msg').textContent = 'Generator error: ' + e.message; }
};
document.getElementById('exportBtn').onclick = async ()=>{
  if(!HAS_API() || !live) return;
  const r = await pywebview.api.export_maze();
  document.getElementById('exportInfo').textContent = r.error ? r.error : 'saved ' + r.path;
};
fitCanvas();
['playBtn','stepBtn','resetBtn','scrubBar'].forEach(id => document.getElementById(id).disabled = true);
render();
</script>
</body>
